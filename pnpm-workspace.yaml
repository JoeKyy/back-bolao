allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  # Aprovar script de instalação de dependência transitiva é superfície de supply chain desnecessária.
  unrs-resolver: false
  "@parcel/watcher": false

# Correção de transitiva apontada pelo `pnpm audit` (GHSA-q7qp-rjg7-q26m): multer vem pelo
# @nestjs/platform-express (o código não usa upload), dentro da mesma versão maior.
overrides:
  "multer@>=2.0.0 <2.5.0": "^2.5.0"

# Risco aceito e registrado (como o AUD-04 do gestor): deepmerge-ts entra pela CLI do Prisma
# (@prisma/config), fora do caminho das requisições. Só some com Prisma 7. Reavaliar na
# atualização do Prisma.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
