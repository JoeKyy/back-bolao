# Local: `docker compose up -d postgres` e a API roda com `pnpm start:dev`.
# Servidor: o mesmo arquivo sobe postgres + api (o nginx do CloudPanel faz o proxy para 127.0.0.1).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      # Sem valor padrão: sem senha definida no .env o compose recusa subir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bolao}
    ports:
      # Só na interface local. Nunca exposto para a rede.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    profiles: ["servidor"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bolao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bolao}?schema=public
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    logging: *logging
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/saude || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
