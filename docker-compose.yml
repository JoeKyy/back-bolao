# Local: `docker compose up -d postgres` e a API roda com `pnpm start:dev`.
# Servidor: `docker compose --profile servidor up -d` sobe postgres + api; o nginx do CloudPanel
# faz o proxy para 127.0.0.1:API_PORT com `proxy_set_header X-Forwarded-For $remote_addr;`.
# Cada ambiente (produção, homologação) tem o seu .env com COMPOSE_PROJECT_NAME, API_PORT e
# POSTGRES_PORT próprios: sem COMPOSE_PROJECT_NAME os dois derivam o mesmo projeto.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      # Sem valor padrão: sem senha definida no .env o compose recusa subir.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bolao}
    ports:
      # Só na interface local. Nunca exposto para a rede.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    profiles: ["servidor"]
    restart: unless-stopped
    # SEC-02: rede do host. Com porta publicada, a conexão do nginx chegaria do gateway da bridge
    # (172.x.0.1), não do loopback, e TRUST_PROXY=loopback faria todo mundo ter o mesmo IP
    # (um travaria o login e as inscrições de todos). Na rede do host o nginx fala com
    # 127.0.0.1:API_PORT de verdade e o X-Forwarded-For dele é o único confiável.
    network_mode: host
    # SEC-12: variáveis explícitas em vez de env_file (o .env inteiro não fica no container).
    # ADMIN_PASSWORD só é lida no primeiro boot (cria o organizador); depois, apague do .env.
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${API_PORT:-3333}
      TRUST_PROXY: loopback
      DATABASE_URL: postgresql://${POSTGRES_USER:-bolao}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-bolao}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS no .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CAIXA_API_URL: ${CAIXA_API_URL:-https://servicebus2.caixa.gov.br/portaldeloterias/api/megasena}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Bolão da Mega <nao-responda@joekyy.com.br>}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_PORT:-3333}/saude || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
